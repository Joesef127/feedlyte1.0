name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy preview to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes)
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Smoke test preview deployment
        if: ${{ env.DEPLOY_URL != '' }}
        env:
          SITE_URL: ${{ env.DEPLOY_URL }}
        run: npm run smoke:deploy

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: []
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to production
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          DEPLOY_URL=$(vercel deploy --prod --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes)
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Smoke test production deployment
        if: ${{ env.DEPLOY_URL != '' }}
        env:
          SITE_URL: ${{ env.DEPLOY_URL }}
        run: npm run smoke:deploy
